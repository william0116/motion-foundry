name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Engineering check (syntax, references, links, formatting)
        run: npm run check

      - name: Node unit tests
        run: npm test

      - name: Browser regression (downloads, export recovery, WebMCP tools, storage, PWA, qa.html)
        run: npm run test:browser

      - name: Upload browser test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
